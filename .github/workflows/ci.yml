name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify bundle checksums
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify wasm2go bundle against googlesql_wasm2go.sha256
        run: make verify

  build:
    name: Go build
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make build
